<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ApplyTrack — Settings</title>
    <style>
      body {
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        max-width: 560px; margin: 0 auto; padding: 0 20px 40px; color: #0f172a;
        background: #f4f6fb;
      }
      header {
        margin: 0 -20px 24px; padding: 22px 20px;
        background: linear-gradient(135deg, #0b1220 0%, #3730a3 70%, #7c3aed 100%);
        color: #fff;
      }
      header h1 { font-size: 20px; margin: 0; }
      header p { font-size: 13px; margin: 4px 0 0; color: #c7d2fe; }
      .card { background: #fff; border: 1px solid #e5e9f0; border-radius: 16px; padding: 20px; }
      label { display: block; font-size: 12px; font-weight: 600; margin: 16px 0 6px; color: #475569; text-transform: uppercase; letter-spacing: .04em; }
      label:first-child { margin-top: 0; }
      input[type="text"], input[type="url"], input[type="password"] {
        width: 100%; padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 14px;
      }
      input:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.15); }
      .checkbox { display: flex; align-items: center; gap: 8px; margin-top: 18px; font-size: 14px; font-weight: 500; color: #334155; }
      button {
        margin-top: 22px; border: 0; background: linear-gradient(90deg, #4f46e5, #7c3aed); color: #fff; padding: 10px 18px;
        border-radius: 10px; font-weight: 600; cursor: pointer;
      }
      p.hint { font-size: 12px; color: #94a3b8; margin-top: 6px; }
      #saved { color: #047857; font-size: 13px; margin-left: 12px; }
    </style>
  </head>
  <body>
    <header>
      <h1>ApplyTrack — Settings</h1>
      <p>Account, dashboard connection &amp; auto-capture.</p>
    </header>

    <div class="card">
      <label>Account</label>
      <div id="accountLoggedOut">
        <input id="accEmail" type="email" placeholder="Email" autocomplete="email" />
        <input id="accPassword" type="password" placeholder="Password" autocomplete="current-password" style="margin-top:8px;" />
        <button id="accLogin" style="margin-top:10px;">Log in</button>
        <p class="hint">Same email + password as the dashboard. No account yet? Register on the dashboard first.</p>
      </div>
      <div id="accountLoggedIn" hidden>
        <p style="margin:0 0 8px; font-size:14px;">Logged in as <strong id="accEmailText"></strong></p>
        <button id="accLogout" style="margin-top:0;">Log out</button>
      </div>

      <label for="apiUrl">API base URL</label>
      <input id="apiUrl" type="url" placeholder="http://localhost:3000" />
      <p class="hint">Where your ApplyTrack dashboard is running.</p>

      <label for="apiKey">Extension API key</label>
      <input id="apiKey" type="password" placeholder="change-me" />
      <p class="hint">Must match <code>EXTENSION_API_KEY</code> in the server .env file.</p>

      <div class="checkbox">
        <input id="autoCapture" type="checkbox" />
        <label for="autoCapture" style="margin:0; text-transform:none; font-size:14px; color:#334155;">Auto-capture applications when I click Apply</label>
      </div>

      <button id="save">Save</button><span id="saved"></span>
    </div>

    <script src="options.js"></script>
  </body>
</html>
